version: 2
updates:
    # Enable version updates for npm
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      groups:
          jest:
              patterns:
                  - "jest"
                  - "jest-*"
                  - "@jest/*"
                  - "@types/jest"
                  - "babel-jest"
                  - "@testing-library/jest-dom"
          react:
              patterns:
                  - "react"
                  - "react-dom"
                  - "react-test-renderer"
                  - "@types/react"
                  - "@types/react-dom"
                  - "@types/react-test-renderer"
          fontawesome:
              patterns:
                  - "@fortawesome/*"

    # Enable version updates for github actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
